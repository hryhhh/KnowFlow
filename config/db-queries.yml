templates:
  - id: kb_stats
    description: "统计知识库信息"
    queryTemplate: "SELECT COUNT(*) AS total FROM knowledge_bases WHERE status = $1"
    params:
      - name: status
        type: string
        description: "知识库状态"
    requiredFields: []

  - id: doc_stats
    description: "统计文档信息"
    queryTemplate: "SELECT COUNT(*) AS total FROM documents WHERE kbId = $1 AND status = $2"
    params:
      - name: kbId
        type: uuid
        description: "知识库 ID"
      - name: status
        type: string
        description: "文档状态"
    requiredFields: ["kbId"]

  - id: chunk_stats
    description: "统计切片信息"
    queryTemplate: "SELECT COUNT(*) AS total FROM chunks WHERE kbId = $1"
    params:
      - name: kbId
        type: uuid
        description: "知识库 ID"
    requiredFields: ["kbId"]

  - id: doc_list
    description: "列出文档"
    queryTemplate: "SELECT id, name, status, chunkCount, createdAt FROM documents WHERE kbId = $1 ORDER BY createdAt DESC LIMIT $2"
    params:
      - name: kbId
        type: uuid
        description: "知识库 ID"
      - name: limit
        type: integer
        description: "返回数量"
    requiredFields: ["kbId"]

  - id: kb_list
    description: "列出知识库"
    queryTemplate: "SELECT id, name, type, status, createdAt FROM knowledge_bases ORDER BY createdAt DESC LIMIT $1"
    params:
      - name: limit
        type: integer
        description: "返回数量"
    requiredFields: []
