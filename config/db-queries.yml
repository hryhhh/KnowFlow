# DB Query Agent — SQL 模板配置
# 由 DbQueryService 加载，按 id 匹配用户意图选择对应模板
# 参数通过 LLM 抽取后注入 $1, $2... 占位符

templates:
  # ==================== 统计类 ====================
  - id: kb_stats
    description: "统计知识库信息（总数、状态分布）"
    queryTemplate: "SELECT COUNT(*) AS total FROM knowledge_bases WHERE status = $1"
    params:
      - name: status
        type: string
        description: "知识库状态，默认 'active'"
    requiredFields: []

  - id: doc_stats
    description: "统计文档信息（总数、按状态分布）"
    queryTemplate: "SELECT COUNT(*) AS total FROM documents WHERE kbId = $1 AND status = $2"
    params:
      - name: kbId
        type: uuid
        description: "知识库 ID"
      - name: status
        type: string
        description: "文档状态，默认 'processed'"
    requiredFields: ["kbId"]

  - id: chunk_stats
    description: "统计切片信息（总数）"
    queryTemplate: "SELECT COUNT(*) AS total FROM chunks WHERE kbId = $1"
    params:
      - name: kbId
        type: uuid
        description: "知识库 ID"
    requiredFields: ["kbId"]

  # ==================== 列表类 ====================
  - id: doc_list
    description: "列出知识库下的文档"
    queryTemplate: |
      SELECT id, name, status, chunkCount, createdAt
      FROM documents
      WHERE kbId = $1
      ORDER BY createdAt DESC
      LIMIT $2
    params:
      - name: kbId
        type: uuid
        description: "知识库 ID"
      - name: limit
        type: integer
        description: "返回数量上限"
    requiredFields: ["kbId"]

  - id: kb_list
    description: "列出所有知识库"
    queryTemplate: |
      SELECT id, name, type, status, createdAt
      FROM knowledge_bases
      ORDER BY createdAt DESC
      LIMIT $1
    params:
      - name: limit
        type: integer
        description: "返回数量上限"
    requiredFields: []

  # ==================== 趋势/排行类 ====================
  - id: doc_creation_trend
    description: "文档创建趋势（按周统计）"
    queryTemplate: |
      SELECT DATE_TRUNC('week', createdAt) AS week, COUNT(*) AS count
      FROM documents
      WHERE kbId = $1 AND createdAt >= $2
      GROUP BY week
      ORDER BY week DESC
      LIMIT $3
    params:
      - name: kbId
        type: uuid
        description: "知识库 ID"
      - name: since
        type: date
        description: "起始日期"
      - name: limit
        type: integer
        description: "返回周数"
    requiredFields: ["kbId"]

  - id: top_docs_by_chunks
    description: "切片数最多的文档排行"
    queryTemplate: |
      SELECT id, name, chunkCount
      FROM documents
      WHERE kbId = $1
      ORDER BY chunkCount DESC
      LIMIT $2
    params:
      - name: kbId
        type: uuid
        description: "知识库 ID"
      - name: limit
        type: integer
        description: "返回数量"
    requiredFields: ["kbId"]
