name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @knowbase-x/rag-engine build
      - run: pnpm --filter @knowbase-x/agents build
      - run: pnpm --filter @knowbase-x/agents test
      - run: pnpm --filter @knowbase-x/rag-engine test
      - run: pnpm --filter @knowbase-x/server test

  # E2E 暂不在 CI 启用：现有用例依赖后端 API/数据库/种子数据（硬编码 kbId、SSE 流），
