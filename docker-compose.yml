# KnowBase X — 基础设施 (PostgreSQL + pgvector + Redis + MinerU)
version: '3.8'

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: kb-pgvector
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_rag}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-network

  redis:
    image: redis:8-alpine
    container_name: kb-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-network

  # ─── MinerU 文档解析服务（可选，按需启用） ───
  # 启动方式：
  #   CPU 模式：docker compose --profile mineru-cpu up -d
  #   GPU 模式：docker compose --profile mineru-gpu up -d
  # 注意：MinerU 镜像需自行构建（官方无预构建 Docker Hub 镜像）
  #   wget https://gcore.jsdelivr.net/gh/opendatalab/MinerU@master/docker/global/Dockerfile
  #   docker build -t ${MINERU_IMAGE:-kb-mineru:local} -f Dockerfile .

  mineru-api:
    image: ${MINERU_IMAGE:-kb-mineru:local}
    container_name: kb-mineru-api
    restart: unless-stopped
    profiles: ["mineru-cpu"]
    entrypoint: ["mineru-api"]
    command: ["--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${MINERU_PORT:-8000}:8000"
    environment:
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-local}
      MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
      MINERU_EFFORT: ${MINERU_EFFORT:-medium}
    volumes:
      - mineru_models:/root/.cache/huggingface/hub
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-network

  # GPU 版本（仅在有 NVIDIA GPU 的机器上使用）
  mineru-api-gpu:
    image: ${MINERU_IMAGE:-kb-mineru:local}
    container_name: kb-mineru-api-gpu
    restart: unless-stopped
    profiles: ["mineru-gpu"]
    ports:
      - "${MINERU_PORT:-8000}:8000"
    environment:
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-local}
      MINERU_BACKEND: ${MINERU_BACKEND:-hybrid-engine}
    volumes:
      - mineru_models:/root/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${MINERU_GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-network
    ipc: host

volumes:
  pgvector_data:
    driver: local
  redis_data:
    driver: local
  mineru_models:
    driver: local

networks:
  kb-network:
    driver: bridge
